name: build

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: site
            base: ""
            preview: ""
          - name: preview
            base: /next
            preview: "1"
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: ${{ matrix.base }}
          PREVIEW: ${{ matrix.preview }}
          SITE_URL: https://elyoxe.com${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: site/out
          retention-days: 7

  critique:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: site, path: site/out }
      # This job never runs npm ci - it pulls only what it needs, so the comparator
      # has to be named here too or visual-diff.mjs cannot import it.
      - run: npm i --no-save playwright@1.55 serve@14 pixelmatch@7 pngjs@7 && npx playwright install --with-deps chromium
      - run: npx serve -l 8080 out & sleep 2
      - run: node scripts/shots.mjs http://localhost:8080 shots
      # shots.mjs proves nothing is broken; it cannot say the page still looks the same.
      # Compare the above-the-fold captures with the last build that passed - the same
      # runner and the same browser, so the only difference left is ours.
      - name: visual diff against the last passing build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow=build.yml --status=success --branch=main                  --limit=1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh run download "$id" -n critique -D prev 2>/dev/null               || echo "run $id kept no critique artifact - nothing to compare"
          else
            echo "no previous successful run on main"
          fi
          node scripts/visual-diff.mjs prev shots --max=2
      - name: lighthouse (mobile)
        if: always()
        run: |
          npm i --no-save lighthouse@12
          # the first run of a cold server+browser is always slow; warm up on / and discard it
          npx lighthouse "http://localhost:8080/" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path=/tmp/warm.json || true
          for p in / "/?noscene" /en/; do
            npx lighthouse "http://localhost:8080$p" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="shots/lh$(echo "$p" | tr '/?' '__').json" || true
          done
          node -e 'for (const f of require("fs").readdirSync("shots").filter(f=>f.startsWith("lh"))) { const r=require("./shots/"+f); console.log(f, Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)]))); }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critique
          path: site/shots
          retention-days: 7
